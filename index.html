    <meta charset="UTF-8">

    <meta name="description" content="El hub oficial del cumpleaños de Andy. Invitación, Escape Room y sorpresas.">
    <meta name="theme-color" content="#100b19">

    <link rel="icon" type="image/png" href="https://file.garden/afW_Y0vtaUHOO25a/cumpleandy_logo-vertical.png">
    <link rel="apple-touch-icon" href="https://file.garden/afW_Y0vtaUHOO25a/cumpleandy_logo-vertical.png">

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cumpleaños de Andy">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg: #0d0914;
            --bg-2: #171020;

            --card: rgba(31, 21, 46, .82);
            --card-solid: #21162f;
            --card-light: rgba(57, 40, 79, .72);

            --white: #fffaf2;
            --muted: #b9aacb;

            --pink: #ff3e7f;
            --pink-light: #ff6b9d;

            --purple: #8b5cf6;
            --purple-light: #a78bfa;

            --gold: #ffce45;
            --gold-light: #ffe28a;

            --display: "Archivo Black", sans-serif;
            --body: "Space Grotesk", sans-serif;

            --radius-xl: 30px;
            --radius-lg: 22px;
            --radius-md: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            width: 100%;

            font-family: var(--body);
            color: var(--white);

            overflow-x: hidden;

            background:
                linear-gradient(
                    180deg,
                    rgba(13, 9, 20, .66),
                    rgba(13, 9, 20, .92)
                ),
                url("https://file.garden/afW_Y0vtaUHOO25a/20260527_165230.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            transition:
                background-image 1.4s ease,
                opacity .4s ease;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding:
                calc(env(safe-area-inset-top) + 54px)
                18px
                calc(env(safe-area-inset-bottom) + 110px);
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;
            z-index: -1;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(139, 92, 246, .22),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(255, 62, 127, .12),
                    transparent 35%
                );
        }

        button,
        a {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        :focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 4px;
        }

        /* =========================
           BACKGROUND PARTICLES
        ========================= */

        .ambient {
            position: fixed;
            inset: 0;

            pointer-events: none;
            overflow: hidden;

            z-index: -1;
        }

        .ambient span {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: rgba(255,255,255,.22);

            animation: floatParticle linear infinite;
        }

        .ambient span:nth-child(1) {
            left: 12%;
            animation-duration: 13s;
            animation-delay: -4s;
        }

        .ambient span:nth-child(2) {
            left: 28%;
            animation-duration: 18s;
            animation-delay: -9s;
        }

        .ambient span:nth-child(3) {
            left: 52%;
            animation-duration: 15s;
            animation-delay: -2s;
        }

        .ambient span:nth-child(4) {
            left: 73%;
            animation-duration: 20s;
            animation-delay: -12s;
        }

        .ambient span:nth-child(5) {
            left: 88%;
            animation-duration: 17s;
            animation-delay: -6s;
        }

        @keyframes floatParticle {
            from {
                transform: translateY(110vh);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }

        /* =========================
           TOP BRAND
        ========================= */

        .top-brand {
            display: flex;
            align-items: center;
            gap: 9px;

            margin-bottom: 20px;

            font-size: .68rem;
            font-weight: 700;

            letter-spacing: .18em;
            text-transform: uppercase;

            color: rgba(255,255,255,.65);
        }

        .top-brand::before,
        .top-brand::after {
            content: "";

            width: 28px;
            height: 1px;

            background: rgba(255,255,255,.25);
        }

        /* =========================
           TICKET
        ========================= */

        .ticket-wrap {
            width: 100%;
            max-width: 450px;

            perspective: 1200px;
        }

        .ticket {
            position: relative;

            width: 100%;

            overflow: hidden;

            border-radius: var(--radius-xl);

            background:
                linear-gradient(
                    145deg,
                    rgba(42,29,61,.94),
                    rgba(27,18,40,.94)
                );

            border: 1px solid rgba(255,255,255,.13);

            box-shadow:
                0 30px 80px rgba(0,0,0,.48),
                0 8px 24px rgba(0,0,0,.32),
                inset 0 1px rgba(255,255,255,.09);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            transform: rotate(-.7deg);

            animation: ticketIn .8s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes ticketIn {
            from {
                opacity: 0;
                transform:
                    translateY(35px)
                    rotate(-3deg)
                    scale(.96);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    rotate(-.7deg)
                    scale(1);
            }
        }

        .ticket::after {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,.08),
                    transparent 28%
                );

            z-index: 10;
        }

        /* =========================
           GOLD CORNER
        ========================= */

        .fold {
            position: absolute;

            top: 0;
            left: 0;

            width: 55px;
            height: 55px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,0,0,.35) 50%,
                    transparent 51%
                );

            z-index: 15;
        }

        /* =========================
           AGE BADGE
        ========================= */

        .badge-14 {
            position: absolute;

            top: 20px;
            right: 18px;

            width: 82px;
            height: 82px;

            border-radius: 50%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            color: #151019;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    var(--gold-light),
                    var(--gold)
                );

            border: 3px dashed rgba(20,15,25,.45);

            box-shadow:
                0 10px 25px rgba(0,0,0,.32),
                inset 0 2px rgba(255,255,255,.4);

            transform: rotate(9deg);

            z-index: 20;

            animation: badgeIn .8s .35s cubic-bezier(.2,1.5,.4,1) both;
        }

        @keyframes badgeIn {
            from {
                opacity: 0;
                transform: scale(.4) rotate(-25deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(9deg);
            }
        }

        .badge-14 .num {
            font-family: var(--display);
            font-size: 1.9rem;
            line-height: 1;
        }

        .badge-14 .txt {
            margin-top: 4px;

            font-size: .52rem;
            font-weight: 800;

            letter-spacing: .13em;
        }

        /* =========================
           HEADER
        ========================= */

        .ticket-top {
            position: relative;

            padding: 38px 28px 28px;

            text-align: center;

            overflow: hidden;
        }

        .ticket-top::before {
            content: "";

            position: absolute;
            inset: 0;

            opacity: .55;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(139,92,246,.22),
                    transparent 45%
                );
        }

        .ticket-top > * {
            position: relative;
            z-index: 2;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 7px 12px;

            border-radius: 50px;

            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.09);

            color: var(--muted);

            font-size: .67rem;
            font-weight: 600;

            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "●";

            color: var(--gold);
            font-size: .45rem;
        }

        .logo-vertical {
            display: block;

            width: min(46vw, 175px);
            height: auto;

            margin: 22px auto 12px;

            filter:
                drop-shadow(0 16px 22px rgba(0,0,0,.5))
                drop-shadow(0 0 24px rgba(139,92,246,.12));

            cursor: pointer;

            transition:
                transform .25s cubic-bezier(.2,1.5,.4,1),
                filter .25s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .logo-vertical:hover {
            transform: scale(1.045) translateY(-3px);
        }

        .logo-vertical:active {
            transform: scale(.91) rotate(-3deg);
        }

        .headline {
            font-family: var(--display);

            font-size: clamp(1.65rem, 8vw, 2.25rem);

            line-height: 1.08;

            letter-spacing: -.025em;
        }

        .headline span {
            color: var(--pink);

            text-shadow:
                0 0 24px rgba(255,62,127,.28);
        }

        .subline {
            margin-top: 10px;

            color: var(--muted);

            font-size: .78rem;
        }

        /* =========================
           DIVIDER
        ========================= */

        .tear {
            position: relative;

            height: 18px;

            background: var(--card-solid);

            border-top: 1px dashed rgba(255,255,255,.14);
            border-bottom: 1px dashed rgba(255,255,255,.08);
        }

        .tear::before,
        .tear::after {
            content: "";

            position: absolute;

            top: 50%;

            width: 18px;
            height: 18px;

            border-radius: 50%;

            background: var(--bg);
        }

        .tear::before {
            left: -9px;
            transform: translateY(-50%);
        }

        .tear::after {
            right: -9px;
            transform: translateY(-50%);
        }

        /* =========================
           OPTIONS
        ========================= */

        .ticket-menu {
            padding: 23px 20px 20px;

            background: var(--card-solid);

            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-opcion {
            position: relative;

            display: flex;
            align-items: center;

            width: 100%;

            min-height: 76px;

            padding: 13px 15px;

            border: 1px solid rgba(255,255,255,.11);
            border-radius: 18px;

            color: var(--white);

            cursor: pointer;

            text-align: left;

            overflow: hidden;

            box-shadow:
                0 9px 20px rgba(0,0,0,.22),
                inset 0 1px rgba(255,255,255,.13);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                border-color .2s ease;
        }

        .btn-opcion::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    110deg,
                    rgba(255,255,255,.11),
                    transparent 42%
                );

            opacity: .7;
        }

        .btn-opcion:hover {
            transform: translateY(-3px);

            box-shadow:
                0 14px 28px rgba(0,0,0,.3),
                inset 0 1px rgba(255,255,255,.16);
        }

        .btn-opcion:active {
            transform: translateY(1px) scale(.985);
        }

        .btn-inv {
            background:
                linear-gradient(
                    135deg,
                    #ff3e7f,
                    #e62f70
                );
        }

        .btn-esc {
            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #7042d8
                );
        }

        .btn-opcion .ico {
            position: relative;

            width: 48px;
            height: 48px;

            flex: 0 0 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: rgba(0,0,0,.17);

            font-size: 1.35rem;

            margin-right: 13px;
        }

        .btn-opcion .lbl-main {
            position: relative;

            display: block;

            font-size: 1rem;
            font-weight: 700;
        }

        .btn-opcion .lbl-sub {
            position: relative;

            display: block;

            margin-top: 3px;

            font-size: .69rem;
            font-weight: 500;

            opacity: .78;
        }

        .arrow {
            position: absolute;

            right: 17px;

            font-size: 1.15rem;

            opacity: .7;

            transition: transform .2s ease;
        }

        .btn-opcion:hover .arrow {
            transform: translateX(4px);
        }

        /* =========================
           FOOTER / BARCODE
        ========================= */

        .ticket-foot {
            position: relative;

            display: flex;
            align-items: center;

            gap: 15px;

            padding: 17px 20px 22px;

            background: var(--card-solid);

            border-top: 1px dashed rgba(255,255,255,.14);
        }

        .barcode {
            flex: 1;

            height: 32px;

            border-radius: 3px;

            opacity: .6;

            background-image:
                repeating-linear-gradient(
                    90deg,
                    var(--white) 0,
                    var(--white) 2px,
                    transparent 2px,
                    transparent 4px,
                    var(--white) 4px,
                    var(--white) 5px,
                    transparent 5px,
                    transparent 8px,
                    var(--white) 8px,
                    var(--white) 11px,
                    transparent 11px,
                    transparent 13px
                );
        }

        .locator {
            font-size: .65rem;

            letter-spacing: .07em;

            color: var(--muted);

            white-space: nowrap;
        }

        /* =========================
           FLOATING BUTTONS
        ========================= */

        .btn-flotante {
            position: fixed;

            bottom:
                calc(
                    env(safe-area-inset-bottom, 0px) + 20px
                );

            width: 58px;
            height: 58px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,.18);

            cursor: pointer;

            z-index: 999;

            font-size: 24px;

            box-shadow:
                0 12px 30px rgba(0,0,0,.38),
                inset 0 1px rgba(255,255,255,.25);

            backdrop-filter: blur(12px);

            transition:
                transform .25s cubic-bezier(.2,1.4,.4,1),
                box-shadow .25s ease;
        }

        .btn-flotante:hover {
            transform: translateY(-5px) scale(1.04);

            box-shadow:
                0 17px 35px rgba(0,0,0,.45),
                inset 0 1px rgba(255,255,255,.3);
        }

        .btn-flotante:active {
            transform: scale(.88);
        }

        .btn-gato-flotante {
            right: 20px;

            background:
                linear-gradient(
                    135deg,
                    var(--gold),
                    #eebc28
                );
        }

        .btn-musica-flotante {
            left: 20px;

            background:
                linear-gradient(
                    135deg,
                    var(--pink),
                    #df286b
                );
        }

        /* =========================
           MUSIC PLAYER
        ========================= */

        #player-container {
            position: fixed;

            left: 20px;

            bottom:
                calc(
                    env(safe-area-inset-bottom, 0px) + 91px
                );

            width: min(300px, calc(100vw - 40px));

            padding: 17px;

            display: none;

            border-radius: 21px;

            background:
                rgba(31,21,46,.94);

            border: 1px solid rgba(255,255,255,.14);

            box-shadow:
                0 20px 50px rgba(0,0,0,.45);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            z-index: 1000;

            animation: playerIn .25s ease;
        }

        @keyframes playerIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            color: var(--gold);

            font-size: .72rem;
            font-weight: 700;

            letter-spacing: .05em;
        }

        .close-player {
            width: 28px;
            height: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: var(--white);

            background: rgba(255,255,255,.07);

            cursor: pointer;

            font-size: 1.1rem;
        }

        .progress-container {
            position: relative;

            width: 100%;
            height: 7px;

            margin: 18px 0;

            border-radius: 20px;

            background: rgba(255,255,255,.1);

            overflow: hidden;

            cursor: pointer;
        }

        .progress-bar {
            height: 100%;

            width: 0%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--pink),
                    var(--purple)
                );

            transition: width .1s linear;
        }

        .player-controls {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 28px;
        }

        .control-btn {
            cursor: pointer;

            font-size: 1.25rem;

            transition:
                transform .2s ease,
                opacity .2s ease;
        }

        .control-btn:hover {
            transform: scale(1.15);
        }

        .control-btn:active {
            transform: scale(.82);
        }

        .control-btn.active {
            color: var(--gold);
        }

        #play-pause {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--pink);

            box-shadow:
                0 8px 20px rgba(255,62,127,.28);
        }

        /* =========================
           WELCOME MODAL
        ========================= */

        #modal-bienvenida {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 22px;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(139,92,246,.18),
                    transparent 45%
                ),
                rgba(9,6,14,.93);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            z-index: 10000;

            transition:
                opacity .45s ease,
                visibility .45s ease;
        }

        #modal-bienvenida.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .cuadro-info {
            position: relative;

            width: min(360px, 100%);

            padding: 34px 28px 30px;

            border-radius: 28px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(42,29,61,.97),
                    rgba(25,16,38,.97)
                );

            border: 1px solid rgba(255,255,255,.14);

            box-shadow:
                0 35px 90px rgba(0,0,0,.55),
                inset 0 1px rgba(255,255,255,.1);

            animation:
                modalIn .65s cubic-bezier(.2,1.2,.3,1);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform:
                    translateY(30px)
                    scale(.92);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .cuadro-info::before {
            content: "";

            position: absolute;

            inset: 1px;

            border-radius: 27px;

            pointer-events: none;

            background:
                linear-gradient(
                    130deg,
                    rgba(255,255,255,.08),
                    transparent 35%
                );
        }

        .stamp {
            position: relative;

            width: 68px;
            height: 68px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #17101e;

            font-family: var(--display);
            font-size: 1.45rem;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    var(--gold-light),
                    var(--gold)
                );

            border: 3px dashed rgba(22,16,31,.45);

            box-shadow:
                0 12px 30px rgba(0,0,0,.3);
        }

        .cuadro-info h2 {
            position: relative;

            font-family: var(--display);

            font-size: 1.55rem;

            line-height: 1.15;
        }

        .cuadro-info p {
            position: relative;

            margin-top: 11px;
            margin-bottom: 25px;

            color: var(--muted);

            font-size: .88rem;
            line-height: 1.5;
        }

        .btn-empezar {
            position: relative;

            width: 100%;

            padding: 15px 30px;

            border: 0;
            border-radius: 50px;

            background:
                linear-gradient(
                    135deg,
                    var(--pink),
                    #df286b
                );

            color: white;

            font-size: .9rem;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(255,62,127,.25);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .btn-empezar:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 32px rgba(255,62,127,.35);
        }

        .btn-empezar:active {
            transform: scale(.97);
        }

        /* =========================
           GENIALLY
        ========================= */

        #contenedorGenially {
            position: fixed;
            inset: 0;

            display: none;

            background: #09070d;

            z-index: 20000;
        }

        #contenedorGenially iframe {
            width: 100%;
            height: 100%;

            border: 0;
        }

        .btn-volver {
            position: absolute;

            top:
                calc(
                    env(safe-area-inset-top, 0px) + 15px
                );

            left: 15px;

            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 10px 16px;

            border-radius: 50px;

            color: white;

            background:
                rgba(24,17,34,.88);

            border: 1px solid rgba(255,255,255,.18);

            text-decoration: none;

            font-size: .8rem;
            font-weight: 700;

            backdrop-filter: blur(12px);

            z-index: 21000;
        }

        /* =========================
           BACKGROUND INDICATORS
        ========================= */

        .bg-dots {
            position: fixed;

            top:
                calc(
                    env(safe-area-inset-top, 0px) + 17px
                );

            left: 50%;

            transform: translateX(-50%);

            display: flex;
            gap: 6px;

            z-index: 50;
        }

        .bg-dots span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: rgba(255,255,255,.25);

            transition:
                transform .3s ease,
                background .3s ease;
        }

        .bg-dots span.active {
            transform: scale(1.5);

            background: var(--gold);
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 600px) {
            body {
                padding-top: 70px;
            }

            .ticket-wrap {
                max-width: 470px;
            }

            .ticket {
                transform: rotate(-.45deg);
            }

            .btn-flotante {
                width: 62px;
                height: 62px;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- PARTICULAS -->
    <div class="ambient" aria-hidden="true">

        <span></span>
        <span></span>

        <span></span>
    </div>

    <!-- MODAL -->
    <div id="modal-bienvenida">

    <!-- ELFSIGHT -->
    <script
        src="https://elfsightcdn.com/platform.js"

    </script>

    <div
        class="elfsight-app-5493391c-2281-4e7f-ae5a-f7bc28513ca7"
        data-elfsight-app-lazy>
    </div>

    <!-- INDICADORES -->
    <div
        class="bg-dots"

    <!-- TICKET -->
    <main class="ticket-wrap">

            <header class="ticket-top">

                <img
                    src="https://file.garden/afW_Y0vtaUHOO25a/cumpleandy_logo-vertical.png"

                    class="logo-vertical"

                    onclick="lanzarCelebracion()"
                >

                <div class="headline">

    <!-- BOTONES FLOTANTES -->

    <button

        aria-label="Sorpresa del gato">

    </button>

            </span>

        id="audioPrincipal"
        src="https://file.garden/afW_Y0vtaUHOO25a/Andy%20Cumple%20Hoy.mp3">

            href="javascript:cerrar()"
            class="btn-volver">

            allow="fullscreen; autoplay"
            allowfullscreen>

    <script>

        /* =========================
           AUDIO
        ========================= */

        const audioC =
            document.getElementById("audioConfeti");

        const audioM =
            document.getElementById("audioMiau");

        const audioP =
            document.getElementById("audioPrincipal");

        const progressBar =
            document.getElementById("progress");

        const playBtn =
            document.getElementById("play-pause");

        const repeatBtn =
            document.getElementById("repeat-btn");

        const player =
            document.getElementById("player-container");


        /* =========================
           SERVICE WORKER
        ========================= */

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("sw.js")
                    .catch(err =>
                        console.log(
                            "SW no registrado",
                            err
                        )
                    );

            });

        }


        /* =========================
           MUSIC PLAYER
        ========================= */

        function togglePlayer() {

            const isOpen =
                player.style.display === "block";

            player.style.display =
                isOpen ? "none" : "block";
        }


        async function togglePlay() {

            try {

                if (audioP.paused) {

                    await audioP.play();

                    playBtn.innerText = "⏸️";

                } else {

                    audioP.pause();

                    playBtn.innerText = "▶️";

                }

            } catch (error) {

                console.log(
                    "No se pudo reproducir el audio:",
                    error
                );

            }

        }


        function stopMusic() {

            audioP.pause();

            audioP.currentTime = 0;

            playBtn.innerText = "▶️";

            progressBar.style.width = "0%";
        }


        function toggleRepeat() {

            audioP.loop = !audioP.loop;

            repeatBtn.classList.toggle(
                "active",
                audioP.loop
            );

        }


        function seek(event) {

            if (!Number.isFinite(audioP.duration)) {
                return;
            }

            const rect =
                event.currentTarget.getBoundingClientRect();

            const position =
                (event.clientX - rect.left) /
                rect.width;

            audioP.currentTime =
                position * audioP.duration;

        }


        audioP.addEventListener(
            "timeupdate",
            () => {

                if (!Number.isFinite(audioP.duration)) {
                    return;
                }

                const percent =
                    (audioP.currentTime /
                        audioP.duration) * 100;

                progressBar.style.width =
                    percent + "%";

            }
        );


        audioP.addEventListener(
            "ended",
            () => {

                playBtn.innerText = "▶️";

            }
        );


        /* =========================
           CAT
        ========================= */

        function miauYJuega() {

            audioM.currentTime = 0;

            audioM.play().catch(() => {});

            audioM.onended = () => {

                abrir(
                    "https://cumpleandy.bypssd.com/tarta.html"
                );

            };

        }


        /* =========================
           CONFETTI
        ========================= */

        function lanzarCelebracion() {

            audioC.currentTime = 0;

            audioC.play().catch(() => {});

            const duration = 1800;

            const end =
                Date.now() + duration;

            const colors = [
                "#ff3e7f",
                "#ffce45",
                "#8b5cf6",
                "#fffaf2"
            ];

            function frame() {

                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 70,
                    origin: {
                        x: 0,
                        y: .65
                    },
                    colors
                });

                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 70,
                    origin: {
                        x: 1,
                        y: .65
                    },
                    colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }

            }

            frame();

        }


        /* =========================
           WELCOME
        ========================= */

        function cerrarBienvenida() {

            const modal =
                document.getElementById(
                    "modal-bienvenida"
                );

            modal.classList.add("hidden");

            setTimeout(() => {

                modal.style.display = "none";

            }, 500);

        }


        /* =========================
           GENIALLY
        ========================= */

        function abrir(url) {

            const container =
                document.getElementById(
                    "contenedorGenially"
                );

            const iframe =
                document.getElementById("iframeG");

            iframe.src = url;

            container.style.display = "block";

            document.body.style.overflow = "hidden";

        }


        function cerrar() {

            const container =
                document.getElementById(
                    "contenedorGenially"
                );

            const iframe =
                document.getElementById("iframeG");

            iframe.src = "";

            container.style.display = "none";

            document.body.style.overflow = "";

        }


        /* =========================
           BACKGROUND CAROUSEL
        ========================= */

        const fondosCumple = [

            "https://file.garden/afW_Y0vtaUHOO25a/20260527_165230.jpg",

            "https://file.garden/afW_Y0vtaUHOO25a/20260527_165241.jpg",

            "https://file.garden/afW_Y0vtaUHOO25a/20260527_165248.jpg",

            "https://file.garden/afW_Y0vtaUHOO25a/20260527_165237.jpg"

        ];


        let indiceFondo = 0;


        const dots =
            document.getElementById("bgDots");


        fondosCumple.forEach(
            (_, index) => {

                const dot =
                    document.createElement("span");

                if (index === 0) {
                    dot.classList.add("active");
                }

                dots.appendChild(dot);

            }
        );


        function cambiarFondoAutomatico() {

            document.body.style.backgroundImage =
                `
                linear-gradient(
                    180deg,
                    rgba(13,9,20,.66),
                    rgba(13,9,20,.92)
                ),
                url("${fondosCumple[indiceFondo]}")
                `;

            [...dots.children].forEach(
                (dot, index) => {

                    dot.classList.toggle(
                        "active",
                        index === indiceFondo
                    );

                }
            );

            indiceFondo =
                (indiceFondo + 1) %
                fondosCumple.length;

        }


        cambiarFondoAutomatico();

        setInterval(
            cambiarFondoAutomatico,
            6000
        );


        /* =========================
           TICKET NUMBER
        ========================= */

        const locator =
            document.getElementById(
                "locatorCode"
            );

        const randomNumber =
            Math.floor(
                1000 + Math.random() * 9000
            );

        locator.textContent =
            "Nº " + randomNumber;

    </script>

</body>
</html>
